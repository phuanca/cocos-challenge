spring.application.name=challenge

spring.config.import=optional:file:.env[.properties]

server.port=8080

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.pool-name=cocos-db-pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Tracing (OpenTelemetry / OTLP)
management.tracing.export.otlp.enabled=${OTEL_TRACES_ENABLED:false}
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLING_PROBABILITY:0.1}
management.otlp.metrics.export.enabled=${OTEL_METRICS_ENABLED:false}
