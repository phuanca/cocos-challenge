services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cocos
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/test/resources/database.sql:/docker-entrypoint-initdb.d/001-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocos -d cocos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
